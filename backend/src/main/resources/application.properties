# ── DataSource ───────────────────────────────────────────────
spring.datasource.url=jdbc:postgresql://localhost:5432/ticketservice
spring.datasource.username=maximmikhalishin
spring.datasource.password=
spring.datasource.driver-class-name=org.postgresql.Driver

# ── JPA / Hibernate ──────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ── JWT ──────────────────────────────────────────────────────
jwt.secret=YourSuperSecretKeyThatIsAtLeast256BitsLong12345678
jwt.expiration=86400000

# ── Mail ─────────────────────────────────────────────────────
spring.mail.host=smtp.yandex.ru
spring.mail.port=465
spring.mail.username=noreply@ticketservice.ru
spring.mail.password=your_mail_password
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.auth=true

# ── Server ───────────────────────────────────────────────────
server.port=8080
server.servlet.context-path=/api

# ── Rate Limiting ────────────────────────────────────────────
rate.limit.requests-per-minute=100

# ── File Storage ─────────────────────────────────────────────
app.storage.tickets-dir=/var/ticketservice/tickets

# ── CORS ─────────────────────────────────────────────────────
app.cors.allowed-origins=http://localhost:3000,https://ticketservice.ru
